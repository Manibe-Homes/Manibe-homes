name: Keep Supabase Alive

on:
  schedule:
    - cron: '23 7 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Manibe Homes
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            -X PATCH "$URL/rest/v1/keepalive?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"last_ping\":\"$NOW\"}")
          echo "HTTP $code"
          cat /tmp/out.txt
          if [ "$code" -ge 300 ]; then exit 1; fi

      - uses: actions/checkout@v4
      - name: Mantener el repo activo
        run: |
          date -u > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || exit 0
          git push
